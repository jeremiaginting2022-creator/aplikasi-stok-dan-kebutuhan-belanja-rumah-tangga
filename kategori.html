<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Kategori</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(to right, #007bff, #00c4ff);
        }
        .sidebar {
            min-height: calc(100vh - 76px);
            width: 250px;
            flex-shrink: 0;
            background-color: #0056b3;
            color: white;
        }
        .sidebar a {
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .sidebar a:hover {
            background: linear-gradient(to right, #ff8c00, #ffa500);
            text-decoration: none;
            padding-left: 15px;
        }
        .sidebar a.active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* ===== Halaman Kategori ===== */
        .judul-halaman {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 0;
        }
        .sub-judul {
            font-size: 0.8rem;
            color: #6c757d;
        }
        .btn-tambah {
            background: #fff;
            border: 1.5px solid #212529;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 1.05rem;
            color: #212529;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-tambah:hover {
            background: #e9ecef;
            border-color: #212529;
        }
        .btn-tambah i { font-size: 1.2rem; }

        /* ===== Popup Tambah Kategori ===== */
        .modal-content.form-kategori {
            border: 0;
            border-radius: 8px;
            padding: 12px 14px 8px;
        }
        .form-kategori .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #000;
        }
        .form-kategori .form-label {
            color: #6c757d;
            margin-bottom: 4px;
        }
        .form-kategori .form-control {
            border: 1.5px solid #6c757d;
            border-radius: 10px;
        }
        .form-kategori textarea.form-control {
            border-radius: 18px;
            resize: none;
        }
        .btn-batal {
            background: #fff;
            color: #6c757d;
            border: 1.5px solid #6c757d;
            border-radius: 6px;
            padding: 8px 20px;
        }
        .btn-batal:hover {
            background: #f1f3f5;
            color: #495057;
            border-color: #495057;
        }
        .btn-submit-kategori {
            background-color: #6366ff;
            color: #fff;
            border: 1.5px solid #4f52d9;
            border-radius: 10px;
            padding: 12px 38px;
        }
        .btn-submit-kategori:hover {
            background-color: #4f52d9;
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-expand-lg px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="aplikasi-removebg-preview.png" alt="Logo" width="50" height="50" class="me-2">
                <span class="judul-aplikasi fs-6 lh-sm text-white">
                    Aplikasi Stok dan Kebutuhan<br>Belanja Rumah Tangga
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item me-lg-3">
                        <a class="nav-link text-white" href="#"><i class="fas fa-bell fs-5"></i></a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Pengguna
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Profil Saya</a></li>
                            <li><a class="dropdown-item" href="#">Pengaturan</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Keluar</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Wrapper -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar p-3">
            <h4 class="mb-4">Menu</h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link active" href="dashboard.html"><i class="fas fa-tachometer-alt fa-fw me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="kategori.html"><i class="fas fa-tachometer-alt fa-fw me-2"></i>Kategori</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="Barang.html"><i class="fas fa-tachometer-alt fa-fw me-2"></i>Barang</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="stok_belanja.html"><i class="fas fa-boxes-stacked fa-fw me-2"></i>Stok Barang</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="daftar_belanja.html"><i class="fas fa-shopping-cart fa-fw me-2"></i>Daftar Belanja</a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="container-fluid p-4">
            <div class="row">
                <div class="col-12">
                    <h1 class="judul-halaman">Kategori</h1>
                    <p class="sub-judul">Tambahkan Kategorinya</p>

                    <button type="button" class="btn-tambah" data-bs-toggle="modal" data-bs-target="#modalTambahKategori">
                        <i class="fas fa-plus"></i> Tambah Kategori
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Popup Tambah Kategori -->
    <div class="modal fade" id="modalTambahKategori" tabindex="-1" aria-labelledby="judulModalKategori" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content form-kategori">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="judulModalKategori">Tambah Kategori</h5>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="namaKategori" class="form-label">Nama Kategori</label>
                            <input type="text" class="form-control" id="namaKategori">
                        </div>
                        <div class="mb-3">
                            <label for="deskripsiKategori" class="form-label">Deskripsi</label>
                            <textarea class="form-control" id="deskripsiKategori" rows="4"></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-3 mt-4">
                            <button type="button" class="btn btn-batal" data-bs-dismiss="modal">Batal</button>
                            <button type="button" class="btn btn-submit-kategori" data-bs-dismiss="modal">Tambah</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (diperlukan agar popup dan dropdown bisa berfungsi) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
